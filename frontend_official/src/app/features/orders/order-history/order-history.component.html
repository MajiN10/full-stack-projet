<div class="container py-5">
  <h2 class="section-title"><i class="bi bi-clock-history me-2"></i>Order History</h2>

  <div *ngIf="orders.length === 0" class="text-center py-5">
    <i class="bi bi-inbox" style="font-size:4rem;color:#ccc;"></i>
    <h5 class="mt-3 text-muted">No orders yet</h5>
    <a routerLink="/products" class="btn mt-3"
       style="background:#1a1a2e;color:white;border-radius:50px;padding:10px 28px;">
      Start Shopping
    </a>
  </div>

  <div *ngFor="let o of orders" class="order-card card mb-4">
    <div class="card-header d-flex justify-content-between align-items-center">
      <div>
        <i class="bi bi-bag-check me-2"></i>
        <strong>Order #{{ o.id }}</strong>
      </div>
      <div class="d-flex align-items-center gap-3">
        <span class="small text-white-50">{{ o.orderDate | date:'mediumDate' }}</span>
        <span class="badge rounded-pill" style="background:#4f8ef7;">{{ o.status }}</span>
      </div>
    </div>
    <div class="card-body p-0">
      <table class="table mb-0" style="font-size:0.9rem;">
        <tbody>
          <tr *ngFor="let item of o.items" style="border-color:#f0f0f0;">
            <td class="ps-4 py-3">
              <i class="bi bi-box me-2 text-muted"></i>{{ item.product?.name }}
            </td>
            <td class="text-muted py-3">x{{ item.quantity }}</td>
            <td class="fw-600 py-3 pe-4 text-end">{{ (item.unitPrice * item.quantity).toFixed(2) }} €</td>
          </tr>
        </tbody>
      </table>
    </div>
    <div class="card-footer bg-transparent d-flex justify-content-end align-items-center py-3 pe-4">
      <span class="text-muted small me-2">Total:</span>
      <span class="fw-700 fs-5">{{ o.totalAmount }} €</span>
    </div>
  </div>
</div>
