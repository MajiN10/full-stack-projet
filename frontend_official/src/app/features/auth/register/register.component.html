<div class="auth-wrapper">
  <div class="auth-card">
    <div class="text-center mb-4">
      <div class="auth-logo"><i class="bi bi-bag-heart-fill" style="color:#4f8ef7;"></i> E-<span>Store</span></div>
      <p class="text-muted small mt-1">Create your free account</p>
    </div>
    <form (ngSubmit)="onSubmit()">
      <div class="mb-3">
        <label class="form-label small">First Name</label>
        <div class="input-group">
          <span class="input-group-text" style="border-radius:10px 0 0 10px;border-color:#e2e8f0;">
            <i class="bi bi-person text-muted"></i>
          </span>
          <input type="text" name="fn" class="form-control" style="border-radius:0 10px 10px 0;"
                 placeholder="John" [(ngModel)]="user.firstName" required>
        </div>
      </div>
      <div class="mb-3">
        <label class="form-label small">Last Name</label>
        <div class="input-group">
          <span class="input-group-text" style="border-radius:10px 0 0 10px;border-color:#e2e8f0;">
            <i class="bi bi-person text-muted"></i>
          </span>
          <input type="text" name="ln" class="form-control" style="border-radius:0 10px 10px 0;"
                 placeholder="Doe" [(ngModel)]="user.lastName" required>
        </div>
      </div>
      <div class="mb-3">
        <label class="form-label small">Email address</label>
        <div class="input-group">
          <span class="input-group-text" style="border-radius:10px 0 0 10px;border-color:#e2e8f0;">
            <i class="bi bi-envelope text-muted"></i>
          </span>
          <input type="email" name="em" class="form-control" style="border-radius:0 10px 10px 0;"
                 placeholder="john@example.com" [(ngModel)]="user.email" required>
        </div>
      </div>
      <div class="mb-4">
        <label class="form-label small">Password</label>
        <div class="input-group">
          <span class="input-group-text" style="border-radius:10px 0 0 10px;border-color:#e2e8f0;">
            <i class="bi bi-lock text-muted"></i>
          </span>
          <input type="password" name="pw" class="form-control" style="border-radius:0 10px 10px 0;"
                 placeholder="••••••••" [(ngModel)]="user.password" required>
        </div>
      </div>
      <button type="submit" class="btn-auth mb-3">
        <i class="bi bi-person-check me-2"></i>Create Account
      </button>
      <p class="text-center small text-muted mb-0">
        Already have an account?
        <a routerLink="/login" style="color:#4f8ef7;font-weight:600;">Sign in</a>
      </p>
    </form>
  </div>
</div>
